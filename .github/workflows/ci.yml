name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tsc -b also type-checks src/api/schemaCheck.ts against the committed schema.d.ts,
      # so hand-written request types are verified without needing a live backend.
      - run: npm run build
